name: Deploy to AWS EC2 with ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Load environment from secret
      run: |
        echo '${{ secrets.ENV_FILE }}' > .env
        
        # Extract variables
        for var in AWS_REGION ECR_REGISTRY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY EC2_HOST; do
          echo "$var=$(grep "^$var=" .env | cut -d'=' -f2- | tr -d '\"')" >> $GITHUB_ENV
        done
        
        # Extract SSH key (multiline)
        awk '/^EC2_SSH_KEY=/{flag=1; sub(/^EC2_SSH_KEY=/, ""); print; next} flag && /^[A-Z_]+=/{flag=0} flag{print}' .env | tr -d '"' | \
        { echo "EC2_SSH_KEY<<EOF"; cat; echo "EOF"; } >> $GITHUB_ENV
      
    - name: Configure AWS & ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Get version
      id: version
      run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
    # Build images
    - name: Build Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./Boversal.Gateway
        push: true
        tags: |
          ${{ env.ECR_REGISTRY }}:gateway-latest
          ${{ env.ECR_REGISTRY }}:gateway-${{ steps.version.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build ProjectManagement
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./ProjectManagementService.API/Dockerfile
        push: true
        tags: |
          ${{ env.ECR_REGISTRY }}:project-management-latest
          ${{ env.ECR_REGISTRY }}:project-management-${{ steps.version.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build Utility
      uses: docker/build-push-action@v5
      with:
        context: ./UtilityService
        push: true
        tags: |
          ${{ env.ECR_REGISTRY }}:utility-latest
          ${{ env.ECR_REGISTRY }}:utility-${{ steps.version.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    # Prepare deployment files
    - name: Create deployment files
      run: |
        # Clean .env (exclude secrets)
        grep -E '^[A-Z_]+=' .env | grep -vE '^(EC2_SSH_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)=' > .env.deploy
        echo "IMAGE_TAG=${{ steps.version.outputs.tag }}" >> .env.deploy
        
        # Docker Compose
        cat > docker-compose.yml << 'EOF'
        services:
          gateway:
            image: ${ECR_REGISTRY}:gateway-${IMAGE_TAG}
            ports: ["8080:8080"]
            environment:
              - ASPNETCORE_ENVIRONMENT=Production
              - ASPNETCORE_URLS=http://+:8080
              - DATABASE_URL=${DATABASE_URL}
              - JWT_KEY=${JWT_KEY}
              - JWT_ISSUER=${JWT_ISSUER}
              - JWT_AUDIENCE=${JWT_AUDIENCE}
              - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
            restart: unless-stopped
            depends_on: [project-management, utility]

          project-management:
            image: ${ECR_REGISTRY}:project-management-${IMAGE_TAG}
            ports: ["8081:8081"]
            environment:
              - ASPNETCORE_ENVIRONMENT=Production
              - ASPNETCORE_URLS=http://+:8081
              - DATABASE_URL=${DATABASE_URL}
              - JWT_KEY=${JWT_KEY}
              - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
            restart: unless-stopped

          utility:
            image: ${ECR_REGISTRY}:utility-${IMAGE_TAG}
            ports: ["8082:8082"]
            environment:
              - ASPNETCORE_ENVIRONMENT=Production
              - ASPNETCORE_URLS=http://+:8082
              - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
              - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT}
              - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
              - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
              - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
              - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
              - AWS_REGION=${AWS_REGION}
              - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
            restart: unless-stopped
        EOF
        
    - name: Copy to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ env.EC2_HOST }}
        username: ec2-user
        key: ${{ env.EC2_SSH_KEY }}
        source: ".env.deploy,docker-compose.yml"
        target: "/home/ec2-user/app-${{ steps.version.outputs.tag }}/"
        
    # Deploy
    - name: Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_HOST }}
        username: ec2-user
        key: ${{ env.EC2_SSH_KEY }}
        command_timeout: 10m
        script: |
          set -e
          APP_DIR="/home/ec2-user/app-${{ steps.version.outputs.tag }}"
          cd "$APP_DIR" && mv .env.deploy .env
          
          # Login to ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          
          # Load env & pull
          set -a && source .env && set +a
          echo "📦 Pulling images..." && docker-compose pull
          
          # Stop old deployment FIRST (to free ports)
          if [ -L /home/ec2-user/current ]; then
            OLD_DIR=$(readlink /home/ec2-user/current)
            if [ -n "$OLD_DIR" ] && [ "$OLD_DIR" != "$APP_DIR" ]; then
              echo "🛑 Stopping old deployment..."
              cd "$OLD_DIR"
              # Try both possible docker-compose file names
              docker-compose down 2>/dev/null || docker-compose -f docker-compose.ecr.yml down 2>/dev/null || true
            fi
          fi
          
          # Also force stop any containers on our ports
          echo "🧹 Cleaning up ports..."
          docker ps -q --filter "publish=8080" --filter "publish=8081" --filter "publish=8082" | xargs -r docker stop || true
          
          # Start new version
          cd "$APP_DIR"
          echo "🚀 Starting new version..." && docker-compose up -d
          
          # Health check
          echo "🔍 Health check..."
          for i in {1..20}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Healthy"; break
            fi
            [ $i -eq 20 ] && echo "❌ Failed" && docker-compose logs --tail=20 && exit 1
            echo "⏳ Waiting ($i/20)..." && sleep 5
          done
          
          # Atomic switch
          ln -sfn "$APP_DIR" /home/ec2-user/current
          
          # Cleanup old deployments (keep last 3)
          cd /home/ec2-user && ls -dt app-* | tail -n +4 | xargs rm -rf 2>/dev/null || true
          docker image prune -f
          
          echo "✅ Deployed v${{ steps.version.outputs.tag }}"
          echo "🌐 http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"
