name: Build & Push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 336036263554.dkr.ecr.ap-southeast-1.amazonaws.com/boversal-backend

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

      - name: Get version
        id: version
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./Boversal.Gateway
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}:gateway-${{ steps.version.outputs.tag }}
            ${{ env.ECR_REGISTRY }}:gateway-latest

      - name: Build Project Management
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ProjectManagementService.API/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}:project-management-${{ steps.version.outputs.tag }}
            ${{ env.ECR_REGISTRY }}:project-management-latest

      - name: Build Utility
        uses: docker/build-push-action@v5
        with:
          context: ./UtilityService
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}:utility-${{ steps.version.outputs.tag }}
            ${{ env.ECR_REGISTRY }}:utility-latest
